[package]
name = "opencode-android"
version = "0.0.0"
description = "OpenCode Android app"
authors = ["Anomaly Innovations"]
edition = "2024"

[lib]
name = "opencode_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
tauri-plugin-haptics = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-mobile-bridge = { path = "mobile-bridge" }
