[package]
name = "tauri-plugin-mobile-bridge"
description = "Mobile bridge for WhisperCode Android"
version = "0.0.0"
edition = "2024"
links = "tauri-plugin-mobile-bridge"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.9.5"
thiserror = "2"
